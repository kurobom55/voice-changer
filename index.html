<title>ボイスチェンジャー サンプラー</title>
<style>
  :root{
    --bg:#0d0f14;
    --panel:#1a1e27;
    --panel2:#20242f;
    --accent:#3ea6ff;
    --ok:#4cd98a;
    --danger:#ff4757;
    --text:#e8eaf0;
    --sub:#8890a0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{
    margin:0;padding:0;min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 40px);
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  #backBtn{
    align-self:flex-start;
    font:inherit;font-size:15px;font-weight:700;
    padding:10px 16px;border:none;border-radius:999px;
    background:#ff924c;color:#fff;box-shadow:0 3px 0 #d8692a;
  }
  #backBtn[hidden]{display:none;}
  h1{
    font-size:17px;
    text-align:center;
    color:var(--sub);
    letter-spacing:2px;
    margin:6px 0 0;
    font-weight:600;
  }
  .panel{
    background:var(--panel);
    border-radius:20px;
    padding:18px;
  }
  .section-label{
    font-size:12px;
    color:var(--sub);
    letter-spacing:1px;
    margin-bottom:12px;
    padding-left:4px;
  }

  /* ---- ことば選択 ---- */
  #target{
    width:100%;
    font:inherit;
    font-size:17px;
    font-weight:700;
    padding:14px 12px;
    border-radius:14px;
    border:2px solid #2c3242;
    background:var(--panel2);
    color:var(--text);
    -webkit-appearance:none;
    appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
    background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;
    background-size:6px 6px,6px 6px;
    background-repeat:no-repeat;
  }
  #targetInfo{
    margin-top:10px;
    font-size:13px;
    color:var(--sub);
    line-height:1.6;
    padding-left:4px;
  }
  #targetInfo b{color:var(--text);font-size:15px;}

  /* ---- 録音ボタン ---- */
  .record-section{text-align:center;}
  #recordBtn{
    width:100%;
    padding:22px 0;
    font-size:20px;
    font-weight:700;
    border:none;
    border-radius:16px;
    background:linear-gradient(180deg,#2a2f3c,#1c202a);
    color:var(--text);
    box-shadow:0 4px 0 #10131a, 0 6px 14px rgba(0,0,0,.4);
    transition:transform .08s;
  }
  #recordBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #10131a;}
  #recordBtn.recording{
    background:linear-gradient(180deg,#ff5b6a,#c1202f);
    box-shadow:0 4px 0 #7a121d, 0 6px 14px rgba(255,60,70,.4);
    animation:blink 1s infinite;
  }
  @keyframes blink{
    0%,100%{opacity:1;}
    50%{opacity:.55;}
  }
  #status{
    margin-top:12px;
    font-size:13px;
    color:var(--sub);
    min-height:16px;
    line-height:1.5;
  }

  /* ---- プリセット ---- */
  .presets{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:18px;
  }
  .presets button{
    font:inherit;
    font-size:13px;
    font-weight:600;
    padding:10px 4px;
    border-radius:12px;
    border:2px solid transparent;
    background:var(--panel2);
    color:var(--sub);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .presets button .emoji{font-size:20px;}
  .presets button.on{
    border-color:var(--accent);
    color:var(--text);
    background:#1c2c40;
  }

  /* ---- スライダー ---- */
  .slider{margin:0 4px 18px;}
  .slider:last-child{margin-bottom:4px;}
  .slider .head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:14px;
    font-weight:700;
    margin-bottom:8px;
  }
  .slider .val{
    font-size:14px;
    color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .slider .ends{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--sub);
    margin-top:4px;
  }
  input[type=range]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:34px;
    background:transparent;
    margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:8px;border-radius:4px;background:#2c3242;
  }
  input[type=range]::-moz-range-track{
    height:8px;border-radius:4px;background:#2c3242;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:28px;height:28px;border-radius:50%;
    background:var(--accent);
    margin-top:-10px;
    box-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-thumb{
    width:28px;height:28px;border-radius:50%;border:none;
    background:var(--accent);
  }

  /* ---- ととのえるスイッチ ---- */
  .switch-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:4px;cursor:pointer;
  }
  .switch-row b{display:block;font-size:16px;}
  .switch-row small{display:block;font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5;}
  .switch-row input{position:absolute;opacity:0;width:0;height:0;}
  .switch-row .sw{
    flex:none;width:54px;height:32px;border-radius:16px;background:#2c3242;position:relative;transition:.2s;
  }
  .switch-row .sw::after{
    content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
    background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.4);
  }
  .switch-row input:checked + .sw{background:var(--ok);}
  .switch-row input:checked + .sw::after{left:25px;}

  /* ---- 再生 ---- */
  #playBtn{
    width:100%;
    padding:26px 0;
    font-size:24px;
    font-weight:800;
    letter-spacing:2px;
    border:none;
    border-radius:18px;
    background:linear-gradient(180deg,#3ea6ff,#1f6fc0);
    color:#fff;
    box-shadow:0 5px 0 #144b83,0 8px 18px rgba(62,166,255,.3);
    transition:transform .08s, opacity .2s;
  }
  #playBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #144b83;}
  #playBtn:disabled{
    opacity:.35;
    background:#2a2f3c;
    box-shadow:none;
  }

  /* ---- 保存 ---- */
  .save-row{display:flex;flex-direction:column;gap:10px;}
  #saveBtn{
    width:100%;
    padding:18px 0;
    font-size:18px;
    font-weight:800;
    border:none;
    border-radius:16px;
    background:linear-gradient(180deg,#4cd98a,#23a35e);
    color:#08210f;
    box-shadow:0 4px 0 #17703f;
  }
  #saveBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #17703f;}
  #saveBtn:disabled{opacity:.35;background:#2a2f3c;color:var(--sub);box-shadow:none;}
  .sub-btns{display:flex;gap:8px;}
  .sub-btns button{
    flex:1;
    font:inherit;
    font-size:13px;
    font-weight:600;
    padding:12px 4px;
    border-radius:12px;
    border:none;
    background:var(--panel2);
    color:var(--text);
  }
  .sub-btns button:disabled{opacity:.35;}
  .sub-btns button.danger{color:#ff8a94;}
  .hint{
    margin-top:10px;
    font-size:12px;
    color:var(--sub);
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="app">
  <button id="backBtn" type="button" hidden>← せんむすびにもどる</button>
  <h1>VOICE SAMPLER</h1>

  <!-- 1. ことばを選ぶ -->
  <div class="panel">
    <div class="section-label">① ろくおんする ことば</div>
    <select id="target"></select>
    <div id="targetInfo"></div>
  </div>

  <!-- 2. 録音 -->
  <div class="panel record-section">
    <div class="section-label" style="text-align:left">② ろくおん</div>
    <button id="recordBtn">● 録音開始</button>
    <div id="status">マイク待機中</div>
  </div>

  <!-- 3. 声をととのえる -->
  <div class="panel">
    <div class="section-label">③ 声をととのえる</div>
    <label class="switch-row">
      <span><b>✨ 聞きやすく整える</b><small>雑音をへらす・こもりを取る・声の大きさをそろえる</small></span>
      <input type="checkbox" id="enhance"><span class="sw"></span>
    </label>
    <div class="slider" style="margin-top:18px">
      <div class="head"><span>響き</span><span class="val" id="reverbVal"></span></div>
      <input type="range" id="reverb" min="0" max="10" step="1">
      <div class="ends"><span>なし</span><span>広い部屋</span></div>
    </div>
  </div>

  <!-- 4. 声の変化 -->
  <div class="panel">
    <div class="section-label">④ 声の変化</div>
    <div class="presets" id="presets"></div>

    <div class="slider">
      <div class="head"><span>声の高さ</span><span class="val" id="pitchVal"></span></div>
      <input type="range" id="pitch" min="-12" max="12" step="1">
      <div class="ends"><span>ひくい</span><span>たかい</span></div>
    </div>
    <div class="slider">
      <div class="head"><span>話す速さ</span><span class="val" id="speedVal"></span></div>
      <input type="range" id="speed" min="0.6" max="1.6" step="0.05">
      <div class="ends"><span>ゆっくり</span><span>はやい</span></div>
    </div>
    <div class="slider">
      <div class="head"><span>声の明るさ</span><span class="val" id="toneVal"></span></div>
      <input type="range" id="tone" min="-12" max="12" step="1">
      <div class="ends"><span>こもる</span><span>あかるい</span></div>
    </div>
  </div>

  <div class="panel">
    <button id="playBtn" disabled>▶ 再生</button>
    <div class="hint">「聞きやすく整える」のオン・オフを切り替えると、自動で再生されるので聞きくらべられます。</div>
  </div>

  <!-- 4. 保存 -->
  <div class="panel">
    <div class="section-label">⑤ ほぞん</div>
    <div class="save-row">
      <button id="saveBtn" disabled>せんむすび用に保存</button>
      <div class="sub-btns">
        <button id="listenBtn" disabled>▶ 保存した声</button>
        <button id="deleteBtn" class="danger" disabled>🗑 けす</button>
        <button id="wavBtn" disabled>⬇ ファイル</button>
      </div>
    </div>
    <div class="hint">録音はこの端末の中だけに保存され、どこにも送信されません。iPhoneでホーム画面から使う場合は、せんむすびの 🎤 ボタンからこの画面を開いて保存してください（ホーム画面のアプリどうしは保存場所が別々のため）。</div>
  </div>
</div>

<script>
(function(){
  /* ================= せんむすびで使うことば =================
     key は せんむすび 側と同じものを使う（変えるときは両方そろえる） */
  const GROUPS = [
    {g:'できた！', items:[{k:'win', n:'できたね！'}]},
    {g:'え', items:[
      {k:'apple',n:'りんご'},{k:'banana',n:'バナナ'},{k:'car',n:'くるま'},{k:'fish',n:'さかな'},
      {k:'star',n:'ほし'},{k:'flower',n:'おはな'},{k:'chick',n:'ひよこ'},{k:'berry',n:'いちご'}
    ]},
    {g:'123', items:['いち','に','さん','よん','ご','ろく'].map((n,i)=>({k:'n'+(i+1), n:(i+1)+'（'+n+'）', say:n}))},
    {g:'ABC', items:'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c=>({k:c, n:c}))},
    {g:'きょうりゅう（できたときの「〇〇だよ！」）', items:
      ['ティラノサウルス','トリケラトプス','ブラキオサウルス','ステゴサウルス','プテラノドン','アンキロサウルス','パラサウロロフス']
      .map(n=>({k:'dino:'+n, n:n+'だよ！'}))},
    {g:'みちの なかま', items:['おひさま','うさちゃん','はっぱちゃん','しずくちゃん','くもちゃん','くまちゃん'].map(n=>({k:'cp:'+n, n:n}))}
  ];
  // せんむすびで登録した写真（同じサイトなので localStorage を読める）
  function photoItems(){
    try{
      const ps = JSON.parse(localStorage.getItem('senmusubi_photos')||'[]')||[];
      return ps.map((p,i)=>({k:'ph'+p.id, n:(p.name||'（なまえなし '+(i+1)+'）')}));
    }catch(e){ return []; }
  }
  function allGroups(){
    const ph = photoItems();
    return ph.length ? GROUPS.concat([{g:'しゃしん', items:ph}]) : GROUPS;
  }
  function flatItems(){ return allGroups().flatMap(g=>g.items); }
  function findItem(k){ return flatItems().find(it=>it.k===k) || null; }

  /* ================= 保存（IndexedDB・せんむすびと共有） ================= */
  let dbP = null;
  function db(){
    if(!dbP){
      dbP = new Promise((res,rej)=>{
        try{
          const r = indexedDB.open('senmusubi_voice', 1);
          r.onupgradeneeded = ()=>{ if(!r.result.objectStoreNames.contains('clips')) r.result.createObjectStore('clips',{keyPath:'key'}); };
          r.onsuccess = ()=>res(r.result);
          r.onerror = ()=>rej(r.error);
        }catch(e){ rej(e); }
      });
    }
    return dbP;
  }
  function tx(mode, fn){
    return db().then(d=>new Promise((res,rej)=>{
      const t = d.transaction('clips', mode), st = t.objectStore('clips');
      const req = fn(st);
      t.oncomplete = ()=>res(req ? req.result : undefined);
      t.onerror = ()=>rej(t.error);
      t.onabort = ()=>rej(t.error);
    }));
  }
  const dbKeys = ()=>tx('readonly', st=>st.getAllKeys());
  const dbGet  = k=>tx('readonly', st=>st.get(k));
  const dbPut  = v=>tx('readwrite', st=>st.put(v));
  const dbDel  = k=>tx('readwrite', st=>st.delete(k));

  /* ================= 状態 ================= */
  let audioContext = null;
  let mediaRecorder = null;
  let mediaStream = null;
  let chunks = [];
  let raw = null;           // 録音（モノラル・前後の無音カット済み）
  let rawSr = 48000;
  let processed = null;     // {sig, data} 加工済みのキャッシュ
  let isRecording = false;
  let isStarting = false;
  let currentSource = null;
  let recTimer = null;
  let savedKeys = new Set();

  const $ = id=>document.getElementById(id);
  const recordBtn=$('recordBtn'), playBtn=$('playBtn'), statusEl=$('status');
  const targetSel=$('target'), targetInfo=$('targetInfo');
  const saveBtn=$('saveBtn'), listenBtn=$('listenBtn'), deleteBtn=$('deleteBtn'), wavBtn=$('wavBtn');
  const pitchEl=$('pitch'), speedEl=$('speed'), toneEl=$('tone'), enhanceEl=$('enhance'), reverbEl=$('reverb');

  /* ================= プリセット ================= */
  const PRESETS = [
    {k:'normal', e:'🎙️', n:'通常',       p:0,  s:1.0,  t:0},
    {k:'low',    e:'😤', n:'渋い男声',   p:-6, s:0.95, t:-6},
    {k:'mild',   e:'🙂', n:'爽やか男声', p:-4, s:1.0,  t:-2},
    {k:'female', e:'👩', n:'女声',       p:4,  s:1.0,  t:3},
    {k:'kid',    e:'🧒', n:'こども',     p:6,  s:1.05, t:4},
    {k:'helium', e:'🎈', n:'ヘリウム',   p:10, s:1.15, t:6}
  ];
  const presetsEl = $('presets');
  PRESETS.forEach(pr=>{
    const b=document.createElement('button');
    b.type='button'; b.dataset.k=pr.k;
    b.innerHTML='<span class="emoji">'+pr.e+'</span>'+pr.n;
    b.addEventListener('click',()=>{
      pitchEl.value=pr.p; speedEl.value=pr.s; toneEl.value=pr.t;
      onSlider();
      if(raw) playWithEffect();
    });
    presetsEl.appendChild(b);
  });

  function settings(){
    return {p:+pitchEl.value, s:+speedEl.value, t:+toneEl.value, e:enhanceEl.checked, r:+reverbEl.value};
  }
  function sigOf(s){
    return [s.p,s.s,s.t,s.e?1:0,s.r].join('|');
  }
  function onSlider(){
    const s=settings();
    $('pitchVal').textContent = (s.p>0?'+':'')+s.p+' 半音';
    $('speedVal').textContent = s.s.toFixed(2)+' 倍';
    $('toneVal').textContent  = (s.t>0?'+':'')+s.t;
    $('reverbVal').textContent = s.r===0 ? 'なし' : s.r;
    presetsEl.querySelectorAll('button').forEach(b=>{
      const pr=PRESETS.find(x=>x.k===b.dataset.k);
      b.classList.toggle('on', pr.p===s.p && Math.abs(pr.s-s.s)<.001 && pr.t===s.t);
    });
    try{ localStorage.setItem('vc_settings', JSON.stringify(s)); }catch(e){}
  }
  [pitchEl,speedEl,toneEl,reverbEl].forEach(el=>el.addEventListener('input',onSlider));
  enhanceEl.addEventListener('change',()=>{ onSlider(); if(raw) playWithEffect(); });
  (function initSettings(){
    let s={p:0,s:1,t:0,e:true,r:0};
    try{ s=Object.assign(s, JSON.parse(localStorage.getItem('vc_settings')||'{}')); }catch(e){}
    pitchEl.value=s.p; speedEl.value=s.s; toneEl.value=s.t; enhanceEl.checked=!!s.e; reverbEl.value=s.r; onSlider();
  })();

  /* ================= ことば選択 ================= */
  function buildTargets(){
    const cur = targetSel.value;
    targetSel.innerHTML='';
    const free=document.createElement('option');
    free.value=''; free.textContent='自由に録音（せんむすびには使わない）';
    targetSel.appendChild(free);
    allGroups().forEach(g=>{
      const og=document.createElement('optgroup'); og.label=g.g;
      g.items.forEach(it=>{
        const o=document.createElement('option');
        o.value=it.k; o.textContent=(savedKeys.has(it.k)?'✓ ':'　 ')+it.n;
        og.appendChild(o);
      });
      targetSel.appendChild(og);
    });
    if([...targetSel.options].some(o=>o.value===cur)) targetSel.value=cur;
    updateTargetInfo();
  }
  function updateTargetInfo(){
    const it = findItem(targetSel.value);
    const total = flatItems().length;
    const done = flatItems().filter(x=>savedKeys.has(x.k)).length;
    if(!it){
      targetInfo.innerHTML='せんむすびで使う声を作るときは、ここで ことば を選んでください。<br>保存ずみ：'+done+' / '+total;
    }else{
      const say = it.say || it.n.replace(/（.*?）/,'');
      targetInfo.innerHTML='録音ボタンを押して <b>「'+say+'」</b> と言ってください。'
        +(savedKeys.has(it.k)?'<br>✓ 保存ずみ（保存すると上書きされます）':'')
        +'<br>保存ずみ：'+done+' / '+total;
    }
    updateButtons();
  }
  targetSel.addEventListener('change', updateTargetInfo);

  function refreshSaved(){
    return dbKeys().then(keys=>{ savedKeys=new Set(keys||[]); buildTargets(); })
      .catch(()=>{ buildTargets(); });
  }

  function updateButtons(){
    const k = targetSel.value;
    playBtn.disabled = !raw;
    wavBtn.disabled  = !raw;
    saveBtn.disabled = !raw || !k;
    listenBtn.disabled = !k || !savedKeys.has(k);
    deleteBtn.disabled = !k || !savedKeys.has(k);
    const it=findItem(k);
    saveBtn.textContent = it ? '「'+(it.say||it.n.replace(/（.*?）/,''))+'」として保存' : 'せんむすび用に保存（①で ことば を選択）';
  }

  /* ================= オーディオ基本 ================= */
  function ensureAudioContext(){
    if(!audioContext){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioContext = new Ctx();
    }
    // iOSは録音後に 'interrupted' になることがあるので running 以外なら resume
    if(audioContext.state !== 'running'){
      const p = audioContext.resume(); if(p && p.catch) p.catch(function(){});
    }
    return audioContext;
  }
  function setStatus(text){ statusEl.textContent = text; }
  function decode(ctx, ab){
    return new Promise((res,rej)=>{
      const p = ctx.decodeAudioData(ab, res, rej);
      if(p && p.catch) p.catch(rej);
    });
  }
  function pickMimeType(){
    if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    const types = ['audio/webm;codecs=opus','audio/webm','audio/mp4'];
    for(const t of types){ if(MediaRecorder.isTypeSupported(t)) return t; }
    return '';
  }

  /* ================= 録音 ================= */
  async function startRecording(){
    if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      setStatus('マイクを使うには https:// で開いてください'); return;
    }
    if(!window.MediaRecorder){ setStatus('このブラウザは録音に対応していません'); return; }

    isStarting = true;
    setStatus('マイクの許可を待っています...');
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio:{echoCancellation:false, noiseSuppression:true, autoGainControl:true} });
    }catch(err){
      isStarting = false; setStatus('マイクへのアクセスが許可されませんでした'); return;
    }
    isStarting = false;

    chunks = [];
    const mimeType = pickMimeType();
    try{
      mediaRecorder = mimeType ? new MediaRecorder(mediaStream,{mimeType}) : new MediaRecorder(mediaStream);
    }catch(e){ mediaRecorder = new MediaRecorder(mediaStream); }

    mediaRecorder.ondataavailable = e=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
    mediaRecorder.onstop = async ()=>{
      if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
      if(!chunks.length){ setStatus('録音データが空でした。もう一度お試しください'); return; }
      setStatus('音声を処理中...');
      try{
        const blob = new Blob(chunks,{type: mediaRecorder.mimeType || mimeType || 'audio/mp4'});
        const ab = await blob.arrayBuffer();
        const buf = await decode(ensureAudioContext(), ab);
        const mono = toMono(buf);
        const t = trimSilence(mono, buf.sampleRate);
        if(!t){ setStatus('声が小さくて聞き取れませんでした。もう少し近くで話してください'); return; }
        raw = t; rawSr = buf.sampleRate; processed = null;
        updateButtons();
        setStatus('録音完了（'+(raw.length/rawSr).toFixed(1)+'秒）。再生して確かめてください');
      }catch(err){
        console.error(err); setStatus('音声のデコードに失敗しました');
      }
    };

    stopPlayback();
    mediaRecorder.start();
    isRecording = true;
    recordBtn.textContent = '■ 録音停止';
    recordBtn.classList.add('recording');
    playBtn.disabled = true; saveBtn.disabled = true; wavBtn.disabled = true;
    const it=findItem(targetSel.value);
    setStatus(it ? '録音中...「'+(it.say||it.n.replace(/（.*?）/,''))+'」と言ったら停止' : '録音中...');
    clearTimeout(recTimer);
    recTimer = setTimeout(()=>{ if(isRecording) stopRecording(); }, 15000);  // 長すぎる録音は自動で止める
  }
  function stopRecording(){
    clearTimeout(recTimer);
    if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
    isRecording = false;
    recordBtn.textContent = '● 録音開始';
    recordBtn.classList.remove('recording');
  }
  recordBtn.addEventListener('click', ()=>{
    ensureAudioContext();
    if(isStarting) return;
    if(!isRecording) startRecording(); else stopRecording();
  });

  /* ================= 音声処理 =================
     高さ：WSOLA（波形をずらして重ね合わせる方法）で長さを変え、
           そのあと再サンプリングで高さを変える → 速さはそのまま、高さだけ変わる
     速さ：同じ WSOLA で長さだけ変える
     明るさ：低音と高音のバランス（シェルビングEQ） */
  function toMono(buf){
    const n=buf.length, ch=buf.numberOfChannels, out=new Float32Array(n);
    for(let c=0;c<ch;c++){ const d=buf.getChannelData(c); for(let i=0;i<n;i++) out[i]+=d[i]/ch; }
    return out;
  }
  function trimSilence(x, sr){
    const W=Math.round(sr*0.01), nW=Math.floor(x.length/W);
    if(nW<3) return null;
    const rms=new Float32Array(nW); let mx=0;
    for(let w=0;w<nW;w++){ let s=0; for(let i=w*W;i<(w+1)*W;i++) s+=x[i]*x[i]; rms[w]=Math.sqrt(s/W); if(rms[w]>mx) mx=rms[w]; }
    if(mx<0.003) return null;
    const th=Math.max(mx*0.08, 0.004);
    // 録音開始直後のノイズ（タップ音）を避けるため、最初の80msは無視
    let a=Math.min(8,nW-1); while(a<nW && rms[a]<th) a++;
    let b=nW-1; while(b>a && rms[b]<th) b--;
    if(a>=nW) return null;
    const s0=Math.max(0,(a-5)*W), s1=Math.min(x.length,(b+10)*W);
    const out=x.slice(s0,s1);
    const f=Math.round(sr*0.01);
    for(let i=0;i<f && i<out.length;i++){ out[i]*=i/f; out[out.length-1-i]*=i/f; }
    return out;
  }
  function wsola(x, stretch, sr){
    const N=Math.round(sr*0.04/2)*2, Hs=N/2, tol=Math.round(sr*0.012);
    const Ha=Hs/stretch, P=2*N+tol+4;
    const xp=new Float32Array(x.length+2*P); xp.set(x,P);
    const outLen=Math.ceil(x.length*stretch);
    const y=new Float32Array(outLen+N);
    const win=new Float32Array(N);
    for(let i=0;i<N;i++) win[i]=0.5-0.5*Math.cos(2*Math.PI*i/N);
    const maxStart=x.length+Hs;
    let prev=0;
    for(let k=0;k*Hs<outLen;k++){
      let start;
      if(k===0){ start=0; }
      else{
        const nat=prev+Hs, nom=Math.round(k*Ha);
        let best=nom, bc=-Infinity;
        for(let off=-tol; off<=tol; off+=2){
          const c0=nom+off; if(c0< -Hs || c0>maxStart) continue;
          let c=0;
          for(let j=0;j<N;j+=4) c+=xp[P+nat+j]*xp[P+c0+j];
          if(c>bc){ bc=c; best=c0; }
        }
        start=best;
      }
      const o=k*Hs;
      for(let j=0;j<N;j++) y[o+j]+=win[j]*xp[P+start+j];
      prev=start;
    }
    return y.subarray(0,outLen);
  }
  function resample(y, r){
    const n=Math.max(1,Math.floor((y.length-1)/r)), out=new Float32Array(n);
    for(let i=0;i<n;i++){ const p=i*r, a=p|0, f=p-a; out[i]=y[a]*(1-f)+(y[a+1]||0)*f; }
    return out;
  }
  function biquad(x, c){
    const out=new Float32Array(x.length);
    const b0=c[0]/c[3], b1=c[1]/c[3], b2=c[2]/c[3], a1=c[4]/c[3], a2=c[5]/c[3];
    let x1=0,x2=0,y1=0,y2=0;
    for(let i=0;i<x.length;i++){
      const v=b0*x[i]+b1*x1+b2*x2-a1*y1-a2*y2;
      x2=x1; x1=x[i]; y2=y1; y1=v; out[i]=v;
    }
    return out;
  }
  // RBJ Audio EQ Cookbook の係数 [b0,b1,b2,a0,a1,a2]
  function coef(type, f, sr, gain, Q){
    const w=2*Math.PI*f/sr, cs=Math.cos(w), sn=Math.sin(w);
    if(type==='lowpass'||type==='highpass'){
      const al=sn/(2*(Q||0.707));
      if(type==='lowpass') return [(1-cs)/2, 1-cs, (1-cs)/2, 1+al, -2*cs, 1-al];
      return [(1+cs)/2, -(1+cs), (1+cs)/2, 1+al, -2*cs, 1-al];
    }
    if(type==='peaking'){
      const A=Math.pow(10,gain/40), al=sn/(2*(Q||1));
      return [1+al*A, -2*cs, 1-al*A, 1+al/A, -2*cs, 1-al/A];
    }
    const A=Math.pow(10,gain/40), al=sn/2*Math.SQRT2, sA=2*Math.sqrt(A)*al;
    if(type==='lowshelf') return [
      A*((A+1)-(A-1)*cs+sA), 2*A*((A-1)-(A+1)*cs), A*((A+1)-(A-1)*cs-sA),
      (A+1)+(A-1)*cs+sA, -2*((A-1)+(A+1)*cs), (A+1)+(A-1)*cs-sA];
    return [ // highshelf
      A*((A+1)+(A-1)*cs+sA), -2*A*((A-1)+(A+1)*cs), A*((A+1)+(A-1)*cs-sA),
      (A+1)-(A-1)*cs+sA, 2*((A-1)-(A+1)*cs), (A+1)-(A-1)*cs-sA];
  }
  /* ---------- 聞きやすく整える ---------- */
  function fft(re, im, inv){
    const n=re.length;
    for(let i=1,j=0;i<n;i++){
      let bit=n>>1; for(;j&bit;bit>>=1) j^=bit; j^=bit;
      if(i<j){ let t=re[i]; re[i]=re[j]; re[j]=t; t=im[i]; im[i]=im[j]; im[j]=t; }
    }
    for(let len=2;len<=n;len<<=1){
      const ang=2*Math.PI/len*(inv?1:-1), wr=Math.cos(ang), wi=Math.sin(ang), h=len>>1;
      for(let i=0;i<n;i+=len){
        let cr=1, ci=0;
        for(let j=0;j<h;j++){
          const a=i+j, b=a+h, tr=re[b]*cr-im[b]*ci, ti=re[b]*ci+im[b]*cr;
          re[b]=re[a]-tr; im[b]=im[a]-ti; re[a]+=tr; im[a]+=ti;
          const nr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=nr;
        }
      }
    }
    if(inv) for(let i=0;i<n;i++){ re[i]/=n; im[i]/=n; }
  }
  // 雑音をへらす：声のない部分から雑音の成分を調べて、全体からその分を引く
  function denoise(x, sr){
    const N=sr>32000?1024:512, H=N/2, B=N/2+1;
    const win=new Float64Array(N); for(let i=0;i<N;i++) win[i]=Math.sin(Math.PI*i/N);
    const xp=new Float32Array(x.length+2*N); xp.set(x,N);
    const F=Math.floor((xp.length-N)/H)+1;
    const re=new Float64Array(N), im=new Float64Array(N);
    const mags=new Float32Array(F*B), energy=new Float64Array(F);
    for(let f=0;f<F;f++){
      for(let i=0;i<N;i++){ re[i]=xp[f*H+i]*win[i]; im[i]=0; }
      fft(re,im,false);
      let e=0;
      for(let k=0;k<B;k++){ const m=Math.hypot(re[k],im[k]); mags[f*B+k]=m; e+=m*m; }
      energy[f]=e;
    }
    // 静かなフレーム（下位15%）の平均を雑音とみなす
    const order=[...energy.keys()].sort((a,b)=>energy[a]-energy[b]);
    const nq=Math.max(3, Math.floor(F*0.15)), noise=new Float64Array(B);
    for(let q=0;q<nq && q<F;q++){ const f=order[q]; for(let k=0;k<B;k++) noise[k]+=mags[f*B+k]/nq; }
    const out=new Float32Array(xp.length), prevG=new Float64Array(B).fill(1), g=new Float64Array(B);
    for(let f=0;f<F;f++){
      for(let i=0;i<N;i++){ re[i]=xp[f*H+i]*win[i]; im[i]=0; }
      fft(re,im,false);
      for(let k=0;k<B;k++){
        const m=mags[f*B+k]+1e-9;
        let v=1-1.8*noise[k]/m;
        v=Math.max(0.15, Math.min(1, v));
        v=Math.max(v, prevG[k]*0.75);        // 急に音が消えないように（ピロピロ音の防止）
        g[k]=v;
      }
      for(let k=0;k<B;k++){
        const sm=(g[Math.max(0,k-1)]+g[k]+g[Math.min(B-1,k+1)])/3;   // となりの周波数となめらかに
        prevG[k]=g[k];
        re[k]*=sm; im[k]*=sm;
        if(k>0 && k<N/2){ re[N-k]=re[k]; im[N-k]=-im[k]; }
      }
      fft(re,im,true);
      for(let i=0;i<N;i++) out[f*H+i]+=re[i]*win[i];
    }
    return out.slice(N, N+x.length);
  }
  // 声の大きさをそろえる（大きいところを抑え、小さいところとの差を縮める）
  function compress(y, sr){
    const n=y.length, W=Math.round(sr*0.01), nW=Math.floor(n/W);
    if(nW<2) return y;
    // 声の出ている部分の平均的な大きさを基準にする（録音の音量に左右されない）
    const wr=new Float64Array(nW); let mx=0;
    for(let w=0;w<nW;w++){ let s=0; for(let i=w*W;i<(w+1)*W;i++) s+=y[i]*y[i]; wr[w]=Math.sqrt(s/W); if(wr[w]>mx) mx=wr[w]; }
    if(mx<=0) return y;
    let sum=0, cnt=0; for(let w=0;w<nW;w++) if(wr[w]>mx*0.15){ sum+=wr[w]; cnt++; }
    const thr=(sum/cnt)*2.0, ratio=2.5;
    const L=Math.round(sr*0.004);                     // 少し先を見て、出だしの大きな音も逃さない
    const aA=Math.exp(-1/(0.002*sr)), aR=Math.exp(-1/(0.12*sr));
    const out=new Float32Array(n);
    let env=0;
    for(let i=0;i<n;i++){
      const a=Math.abs(y[i+L]||0);
      env = a>env ? aA*env+(1-aA)*a : aR*env+(1-aR)*a;
      let g=1;
      if(env>thr) g=Math.pow(env/thr, -(1-1/ratio));
      out[i]=y[i]*g;
    }
    return out;
  }
  // 響き（小さな部屋〜広い部屋の残響）
  function reverb(y, sr, amt){
    const tail=Math.round(sr*(0.25+0.9*amt));
    const n=y.length+tail, wet=new Float32Array(n);
    const fb=0.70+0.14*amt, damp=0.35;
    [29.7,37.1,41.1,43.7].forEach(ms=>{
      const D=Math.round(sr*ms/1000), buf=new Float32Array(D); let idx=0, filt=0;
      for(let i=0;i<n;i++){
        const input=i<y.length?y[i]:0, o=buf[idx];
        filt=o*(1-damp)+filt*damp;
        buf[idx]=input+filt*fb; idx=(idx+1)%D;
        wet[i]+=o*0.25;
      }
    });
    [5.0,1.7].forEach(ms=>{
      const D=Math.round(sr*ms/1000), buf=new Float32Array(D), g=0.7; let idx=0;
      for(let i=0;i<n;i++){ const bo=buf[idx], v=wet[i]; wet[i]=-g*v+bo; buf[idx]=v+g*bo; idx=(idx+1)%D; }
    });
    const out=new Float32Array(n), mix=0.55*amt;
    for(let i=0;i<n;i++) out[i]=(i<y.length?y[i]:0)+wet[i]*mix;
    // 末尾をなめらかに消す
    const f=Math.round(sr*0.05); for(let i=0;i<f;i++) out[n-1-i]*=i/f;
    return out;
  }
  let dnCache=null;
  function getDenoised(x, sr){
    if(!dnCache || dnCache.src!==x) dnCache={src:x, data:denoise(x, sr)};
    return dnCache.data;
  }

  function processVoice(x, sr, s){
    const r=Math.pow(2, s.p/12), stretch=r/s.s;
    if(s.e) x=getDenoised(x, sr);
    let y = Math.abs(stretch-1)<1e-3 ? x.slice() : wsola(x, stretch, sr);
    if(Math.abs(r-1)>1e-3){
      if(r>1) y=biquad(y, coef('lowpass', Math.min(0.45*sr/r, 0.45*sr), sr, 0, 0.707));  // 折り返しノイズ防止
      y=resample(y, r);
    }
    y=biquad(y, coef('highpass', 70, sr, 0, 0.707));
    if(s.t!==0){
      y=biquad(y, coef('lowshelf', 250, sr, -s.t/2));
      y=biquad(y, coef('highshelf', 2500, sr, s.t));
    }
    if(s.e){
      y=biquad(y, coef('highpass', 90, sr, 0, 0.707));     // 低いボワつき・振動音
      y=biquad(y, coef('peaking', 300, sr, -3, 1.0));      // こもり
      y=biquad(y, coef('peaking', 3500, sr, 3, 0.9));      // 言葉のはっきり感
      y=biquad(y, coef('highshelf', 9000, sr, 2));         // 空気感
      y=compress(y, sr);
    }
    if(s.r>0) y=reverb(y, sr, s.r/10);
    // 音量をそろえる（最大 -1dB、上げすぎない）
    let pk=0; for(let i=0;i<y.length;i++){ const a=Math.abs(y[i]); if(a>pk) pk=a; }
    if(s.e && y.length>1000){
      // 一瞬だけの大きな音に合わせず、ほとんどの部分が大きく聞こえるようにして、はみ出しはやわらかく丸める
      const abs=Float32Array.from(y, Math.abs).sort();
      pk=abs[Math.floor(abs.length*0.9995)] || pk;
    }
    if(pk>0){
      const g=Math.min(0.85/pk, 10);
      for(let i=0;i<y.length;i++){
        let v=y[i]*g;
        if(v>0.85) v=0.85+0.13*Math.tanh((v-0.85)/0.13); else if(v<-0.85) v=-0.85-0.13*Math.tanh((-v-0.85)/0.13);
        y[i]=v;
      }
    }
    return y;
  }
  function getProcessed(){
    const s=settings(), sig=sigOf(s);
    if(!processed || processed.sig!==sig) processed={sig, data:processVoice(raw, rawSr, s)};
    return processed.data;
  }

  /* ================= 再生 ================= */
  function stopPlayback(){
    if(currentSource){ try{ currentSource.stop(); }catch(e){} currentSource=null; }
  }
  function playData(data, sr){
    const ctx=ensureAudioContext();
    stopPlayback();
    const b=ctx.createBuffer(1, data.length, sr);
    b.getChannelData(0).set(data);
    const src=ctx.createBufferSource();
    src.buffer=b; src.connect(ctx.destination);
    src.onended=()=>{ if(currentSource===src) currentSource=null; };
    currentSource=src; src.start(0);
  }
  function playWithEffect(){
    if(!raw) return;
    ensureAudioContext();
    const cached = processed && processed.sig===sigOf(settings());
    if(!cached) setStatus('声を変えています...');
    // 画面を更新してから重い処理をする
    setTimeout(()=>{
      try{
        playData(getProcessed(), rawSr);
        setStatus('再生中（'+(processed.data.length/rawSr).toFixed(1)+'秒）');
      }catch(e){ console.error(e); setStatus('声の加工に失敗しました'); }
    }, cached?0:30);
  }
  playBtn.addEventListener('click', ()=>{ ensureAudioContext(); playWithEffect(); });

  /* ================= WAV 変換 ================= */
  function toWav(data, sr){
    const n=data.length, ab=new ArrayBuffer(44+n*2), v=new DataView(ab);
    const ws=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
    ws(0,'RIFF'); v.setUint32(4,36+n*2,true); ws(8,'WAVE'); ws(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    ws(36,'data'); v.setUint32(40,n*2,true);
    for(let i=0;i<n;i++){ const s=Math.max(-1,Math.min(1,data[i])); v.setInt16(44+i*2, s<0?s*0x8000:s*0x7FFF, true); }
    return ab;
  }

  /* ================= 保存・聞く・けす ================= */
  saveBtn.addEventListener('click', async ()=>{
    const k=targetSel.value, it=findItem(k);
    if(!raw || !it) return;
    ensureAudioContext();
    setStatus('保存しています...');
    await new Promise(r=>setTimeout(r,30));
    try{
      const data=getProcessed();
      await dbPut({key:k, label:it.n, wav:toWav(data, rawSr), sr:rawSr, settings:settings(), t:Date.now()});
      savedKeys.add(k);
      // 次のことばへ進む（まとめて録音しやすいように）
      const list=flatItems(), i=list.findIndex(x=>x.k===k), next=list[i+1];
      raw=null; processed=null;
      buildTargets();
      if(next){
        targetSel.value=next.k; updateTargetInfo();
        setStatus('「'+(it.say||it.n.replace(/（.*?）/,''))+'」を保存しました。つぎは「'+(next.say||next.n.replace(/（.*?）/,''))+'」です');
      }else{
        setStatus('「'+(it.say||it.n.replace(/（.*?）/,''))+'」を保存しました');
      }
      updateButtons();
    }catch(e){
      console.error(e);
      setStatus('保存できませんでした（プライベートブラウズでは保存できません）');
    }
  });
  listenBtn.addEventListener('click', async ()=>{
    const k=targetSel.value; if(!k) return;
    const ctx=ensureAudioContext();
    try{
      const rec=await dbGet(k); if(!rec) return;
      const b=await decode(ctx, rec.wav.slice(0));
      stopPlayback();
      const src=ctx.createBufferSource(); src.buffer=b; src.connect(ctx.destination);
      src.onended=()=>{ if(currentSource===src) currentSource=null; };
      currentSource=src; src.start(0);
    }catch(e){ console.error(e); setStatus('保存した声を再生できませんでした'); }
  });
  deleteBtn.addEventListener('click', async ()=>{
    const k=targetSel.value, it=findItem(k); if(!k) return;
    if(!confirm('「'+(it?it.n:k)+'」の声をけしますか？\nせんむすびでは、元の読み上げにもどります。')) return;
    try{ await dbDel(k); savedKeys.delete(k); buildTargets(); setStatus('けしました'); }
    catch(e){ setStatus('けせませんでした'); }
  });
  wavBtn.addEventListener('click', ()=>{
    if(!raw) return;
    const it=findItem(targetSel.value);
    const name=(it ? it.n.replace(/[\\/:*?"<>|！]/g,'') : 'voice')+'.wav';
    const blob=new Blob([toWav(getProcessed(), rawSr)],{type:'audio/wav'});
    // iPhoneは共有シート（「ファイルに保存」やLINEで送る）を使う
    try{
      const file=new File([blob], name, {type:'audio/wav'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file]}).catch(function(){});
        return;
      }
    }catch(e){}
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=(it ? it.n.replace(/[\\/:*?"<>|！]/g,'') : 'voice')+'.wav';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
  });

  // せんむすびで写真を追加して戻ってきたときにも一覧を更新
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshSaved(); });
  // せんむすびから開いたときは「もどる」ボタンを出す
  const backBtn=$('backBtn');
  if(/[?&]from=senmusubi/.test(location.search)){
    backBtn.hidden=false;
    backBtn.addEventListener('click', ()=>{ stopPlayback(); location.href='../senmusubi/'; });
  }
  refreshSaved();
})();
</script>
